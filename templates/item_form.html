{% extends "base.html" %}
{% block title %}{{ 'Edit' if item_id else 'Add' }} item{% endblock %}
{% block fab %}{% endblock %}
{% block content %}
<form method="post" class="card">
  <label style="margin-top:0">Name</label><input name="name" required value="{{ item.name if item else '' }}">
  <label>Category</label><input name="category" required list="cats" value="{{ item.category if item else '' }}">
  <datalist id="cats"><option>Tents</option><option>Cooking</option><option>Furniture</option><option>Decoration</option><option>Lighting</option></datalist>
  <label>Total quantity</label><input type="number" inputmode="numeric" min="0" name="total_qty" required value="{{ item.total_qty if item else '' }}">
  <div class="grid2">
    <div><label>Rate / day (₹)</label><input type="number" inputmode="decimal" min="0" step="0.01" name="rate_per_day" required value="{{ item.rate_per_day if item else '' }}"></div>
    <div><label>Deposit / unit (₹)</label><input type="number" inputmode="decimal" min="0" step="0.01" name="deposit" value="{{ item.deposit if item else 0 }}"></div>
  </div>
  <button class="btn block mt">Save</button>
</form>
{% endblock %}
