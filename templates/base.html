<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rental Shop{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('dashboard') }}">⛺ Event Hire Shop</a>
  <a href="{{ url_for('bookings') }}">Bookings</a>
  <a href="{{ url_for('booking_new') }}">+ New Booking</a>
  <a href="{{ url_for('items') }}">Inventory</a>
  <a href="{{ url_for('customers') }}">Customers</a>
</nav>
<main>
  {% for category, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
