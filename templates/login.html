{% extends "base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}
{% block subtitle %}<small>{{ _(shop_name) }}</small>{% endblock %}
{% block back %}{% endblock %}
{% block fab %}{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<form method="post" class="card">
  {{ csrf_input() }}
  <label for="user" style="margin-top:0">{{ _('Username') }}</label>
  <input id="user" name="user" required autofocus autocomplete="username" autocapitalize="none">
  <label for="password">{{ _('Password') }}</label>
  <input id="password" type="password" name="password" required autocomplete="current-password">
  <button class="btn block mt">{{ _('Login') }}</button>
</form>
{% endblock %}
