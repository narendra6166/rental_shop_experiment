{% extends "base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}
{% block subtitle %}<small>{{ _(shop_name) }}</small>{% endblock %}
{% block back %}{% endblock %}
{% block fab %}{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<form method="post" class="card">
  <label style="margin-top:0">{{ _('ID') }}</label>
  <input name="user" required autofocus autocomplete="username" autocapitalize="none">
  <label>{{ _('Password') }}</label>
  <input type="password" name="password" required autocomplete="current-password">
  <button class="btn block mt">{{ _('Login') }}</button>
</form>
{% endblock %}
