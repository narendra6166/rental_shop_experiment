{% extends "base.html" %}
{% block title %}{{ _('Add customer') }}{% endblock %}
{% block fab %}{% endblock %}
{% block content %}
<form method="post" class="card">
  {{ csrf_input() }}
  <label style="margin-top:0">{{ _('Name') }}</label><input name="name" required value="{{ c.get('name', '') }}">
  <label for="phone">{{ _('Phone') }}</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" title="{{ _('Phone number must contain exactly 10 digits.') }}" required value="{{ c.get('phone', '') }}">
  <label>{{ _('Address') }}</label><textarea name="address" rows="2">{{ c.get('address', '') }}</textarea>
  <button class="btn block mt">{{ _('Save') }}</button>
</form>
{% endblock %}
