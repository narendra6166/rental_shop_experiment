{% extends "base.html" %}
{% block title %}{{ _('Edit staff') if staff_id else _('Add staff') }}{% endblock %}
{% block fab %}{% endblock %}
{% block content %}
<form method="post" class="card">
  <label style="margin-top:0">{{ _('Name') }}</label><input name="name" required value="{{ p.get('name', '') }}">
  <label for="phone">{{ _('Phone') }}</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" title="{{ _('Phone number must contain exactly 10 digits.') }}" value="{{ p.get('phone', '') or '' }}">
  <label>{{ _('Role') }}</label><input name="role" required list="roles" placeholder="{{ _('Driver, Helper, Cook...') }}" value="{{ p.get('role', '') }}">
  <datalist id="roles"><option>Driver</option><option>Helper</option><option>Loader</option><option>Tent worker</option><option>Supervisor</option></datalist>
  <div class="grid2">
    <div><label>{{ _('Salary type') }}</label>
      <select name="salary_type">{% for st in salary_types %}<option value="{{ st }}" {{ 'selected' if p.get('salary_type', 'Monthly') == st }}>{{ _(st) }}</option>{% endfor %}</select></div>
    <div><label>{{ _('Salary amount (₹) — per month or per day') }}</label><input type="number" inputmode="decimal" min="0" step="1" name="monthly_salary" required value="{{ p.get('monthly_salary', '') }}"></div>
  </div>
  <label>{{ _('Joining date') }}</label><input type="date" name="join_date" value="{{ p.get('join_date', '') or '' }}">
  <label>{{ _('Complete address') }}</label><textarea name="address" rows="3">{{ p.get('address', '') or '' }}</textarea>
  <div class="grid2">
    <div><label>{{ _('ID proof') }}</label>
      <select name="id_type"><option value="">—</option>{% for it in id_types %}<option value="{{ it }}" {{ 'selected' if p.get('id_type') == it }}>{{ _(it) }}</option>{% endfor %}</select></div>
    <div><label>{{ _('ID number') }}</label><input name="id_number" value="{{ p.get('id_number', '') or '' }}"></div>
  </div>
  {% if staff_id %}
  <label>{{ _('Status') }}</label>
  <select name="active"><option value="1" {{ 'selected' if p.get('active', 1)|string == '1' }}>{{ _('Active') }}</option><option value="0" {{ 'selected' if p.get('active', 1)|string == '0' }}>{{ _('Inactive (left)') }}</option></select>
  {% endif %}
  <button class="btn block mt">{{ _('Save') }}</button>
</form>
{% endblock %}
