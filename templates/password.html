{% extends "base.html" %}
{% block title %}{{ _('Change password') }}{% endblock %}
{% block fab %}{% endblock %}
{% block content %}
<form method="post" class="card">
  {{ csrf_input() }}
  <input type="hidden" name="username" autocomplete="username" value="{{ current_user.username }}">
  <label for="current">{{ _('Current password') }}</label><input id="current" type="password" name="current_password" required autocomplete="current-password">
  <label for="new">{{ _('New password') }}</label><input id="new" type="password" name="new_password" required minlength="12" autocomplete="new-password">
  <p class="muted">{{ _('Use at least 12 characters for the password.') }}</p>
  <button class="btn block mt">{{ _('Save') }}</button>
</form>
{% endblock %}
